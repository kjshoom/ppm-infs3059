<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f6f2" />
    <meta name="description" content="Sign in to the PPM project portfolio workspace." />
    <meta name="referrer" content="no-referrer" />
    <title>Sign in · PPM</title>
    <link rel="icon" href="public/favicon.svg" />
    <link rel="stylesheet" href="app/globals.css?v=20261008-password-reset-v1" />
  </head>
  <body class="auth-page">
    <header class="auth-page-header">
      <a class="wordmark" href="./index.html" aria-label="PPM home"><span class="wordmark-dot" aria-hidden="true"></span><span>PPM</span></a>
      <a href="./workplace.html">The workplace <span aria-hidden="true">↗</span></a>
    </header>
    <main class="auth-page-main">
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-mark" aria-hidden="true"><span class="wordmark-dot"></span></div>
        <p class="section-kicker">Project Portfolio Management</p>
        <h1 id="auth-title">Sign in</h1>
        <p class="auth-subtitle" id="auth-subtitle">Use your PPM account to enter the workplace.</p>
        <form id="auth-form" novalidate>
          <label class="auth-field auth-signup-only" hidden>Full name<input id="auth-name" name="name" autocomplete="name" maxlength="60" /></label>
          <label class="auth-field" id="auth-email-field">Email<input id="auth-email" name="email" type="email" autocomplete="email" required /></label>
          <label class="auth-field" id="auth-password-field">Password<input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8" /></label>
          <label class="auth-field" id="auth-password-confirm-field" hidden>Confirm new password<input id="auth-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" /></label>
          <label class="auth-field auth-signup-only" hidden>Workspace role
            <select id="auth-role" name="role">
              <option>Portfolio Manager</option>
              <option>Project Proposer</option>
              <option>Reviewer</option>
            </select>
          </label>
          <p class="auth-message" id="auth-message" role="alert"></p>
          <button type="submit" class="auth-submit" id="auth-submit">Continue</button>
        </form>
        <button class="auth-forgot-link" type="button" id="auth-forgot-password">Forgot password?</button>
        <a class="auth-back-link auth-reset-signin" id="auth-reset-signin" href="./login.html" hidden>← Back to sign in</a>
        <p class="auth-mode-switch"><span id="auth-switch-copy">New to this prototype?</span> <button type="button" id="auth-switch">Create account</button></p>
        <div class="auth-local-note" id="auth-storage-note"><strong>Shared account</strong><p>Sign in with the same account on another device to open your synced project workspace.</p></div>
        <a class="auth-back-link" href="./index.html">← Back to the introduction</a>
      </section>
    </main>
    <script src="api-config.js?v=20261004-api-v1"></script>
    <script src="auth-ui.js?v=20261008-password-reset-v1"></script>
  </body>
</html>
