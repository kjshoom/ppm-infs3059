server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ppm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ppm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ppm}
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
ppm.allowed-origins=${PPM_ALLOWED_ORIGINS:https://kjshoom.github.io,http://localhost:4173,http://127.0.0.1:4173}
ppm.session-hours=${PPM_SESSION_HOURS:168}
