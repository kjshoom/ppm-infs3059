# Production must be configured with a real external PostgreSQL connection.
# Do not silently fall back to the local development database in production.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.sql.init.mode=always
ppm.allowed-origins=${PPM_ALLOWED_ORIGINS:https://kjshoom.github.io}
ppm.session-hours=${PPM_SESSION_HOURS:168}
ppm.password-reset.url=${PPM_PASSWORD_RESET_URL:https://kjshoom.github.io/ppm-infs3059/login.html?mode=reset}
ppm.password-reset.mail-enabled=${PPM_PASSWORD_RESET_MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
ppm.mail.from=${PPM_MAIL_FROM:${SMTP_USERNAME:}}
