services:
  - type: web
    name: ppm-account-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: PPM_ALLOWED_ORIGINS
        value: https://kjshoom.github.io,http://localhost:4173,http://127.0.0.1:4173
      - key: PPM_SESSION_HOURS
        value: "168"
      - key: PPM_PASSWORD_RESET_MAIL_ENABLED
        value: "true"
      - key: PPM_PASSWORD_RESET_URL
        value: https://kjshoom.github.io/ppm-infs3059/login.html?mode=reset
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PPM_MAIL_FROM
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
